<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Desafio Tema 5 - Estilização Web</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  
  <div class="grid-container">
    <header class="header">Header Semântico</header>
    <aside class="sidebar">Sidebar de Navegação</aside>
    
    <main class="main-content">
      
  
      <div class="depth-card">
        <h3>Card de Proposta 1</h3>
        <p>Análise de métricas de software com profundidade visual.</p>
        
        
        <button class="btn-animated">Conectar Agora</button>
      </div>

      <div class="depth-card">
        <h3>Card de Proposta 2</h3>
        <p>Abaixo veja um botão com corte geométrico feito em clip-path.</p>
        
        
        <button class="btn-polygon">Acessar Sistema</button>
      </div>

      <div class="depth-card">
        <h3>Card de Proposta 3</h3>
        <p>Preencha seus dados no formulário abaixo:</p>
        
       
        <form class="custom-form">
          <div class="input-group">
            <input type="email" id="email" placeholder="Digite seu e-mail corporativo..." required>
          </div>
        </form>
      </div>

    </main>
    
    <footer class="footer">Footer Corporativo</footer>
  </div>

</body>
</html>
